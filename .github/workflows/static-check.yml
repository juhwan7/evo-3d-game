name: Static Check
on:
  push:
    branches: [main, experimental]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project state
        run: python3 scripts/validate_state.py
      - name: Reject obvious secret files
        run: |
          if find . -maxdepth 3 -type f \( -name '.env' -o -name '*.pem' -o -name 'id_rsa' \) | grep -q .; then
            echo "Potential secret file detected"
            exit 1
          fi
